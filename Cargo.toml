[workspace]
resolver = "3"
members = ["app", "crates/host", "crates/mapdata", "crates/maps", "crates/plugin", "crates/probe", "crates/setup", "crates/shared"]

[workspace.package]
version = "3.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Every `unsafe` says why it's sound: a `// SAFETY:` note on each block and impl, a `# Safety` section on each
# public `unsafe fn`.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[profile.release]
# The shipped binaries, as small as they go (owner 2026-11-18: the installer is 47 MB): optimised for
# size, one codegen unit so the LTO sees everything, and the symbols stripped. Panics then say the crate
# and the backtrace but not the line — a crash still names its call in `plugin.log`, and the size is what
# a player notices.
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Debug builds keep line numbers (panics, backtraces) but not full debug symbols: Windows' .pdb files, kept
# for every kind of build (tauri dev, tests, clippy, examples), grew target/ past 40 GB. Third-party crates
# get none at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
